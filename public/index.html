<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0d6efd" />
  <meta name="description" content="Notes - Learn C, C++, Java, PHP, HTML, CSS, JavaScript & Bootstrap" />

  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon-180.png" />
  <title>Notes</title>

  <!-- Bootstrap 5 -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  />
  <!-- Font Awesome icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />
  <script>
  (function(l) {
    if (l.search[1] === "/" ) {
      var decoded = l.search
        .slice(1)
        .split("&")
        .map(function(s) {
          return s.replace(/~and~/g, "&");
        })
        .join("?");

      window.history.replaceState(
        null,
        null,
        l.pathname.slice(0, -1) + decoded + l.hash
      );
    }
  }(window.location))
</script>
</head>
<script>
(function(){
  var q=location.search;
  if(q.indexOf('?/')===0){
    var raw=q.slice(2).replace(/~and~/g,'&');
    var amp=raw.indexOf('&');
    var route=amp>=0?raw.slice(0,amp):raw;
    var extra=amp>=0?raw.slice(amp+1):'';
    history.replaceState(null,'','/Notes/'+route+(extra?'?'+extra:'')+location.hash);
  }
})();
</script>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

  <!-- Bootstrap JS bundle (for dropdowns/collapse etc.) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
