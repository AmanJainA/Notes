<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a9fd"/>
      <stop offset="100%" stop-color="#007afc"/>
    </linearGradient>
    <linearGradient id="letterShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eaf4ff"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#001a33" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bg)"/>

  <rect x="16" y="16" width="480" height="240" rx="110" fill="#ffffff" opacity="0.08"/>

  <g filter="url(#softShadow)">
    <text x="50%" y="61%" text-anchor="middle"
          font-family="'Segoe UI', 'Josefin Sans', Arial, sans-serif"
          font-weight="700" font-size="255"
          fill="url(#letterShine)" letter-spacing="-6">AJ</text>
  </g>

  <path d="M 96 392 A 200 200 0 0 0 416 392" stroke="#ffffff" stroke-opacity="0.5" stroke-width="10" fill="none" stroke-linecap="round"/>
</svg>
